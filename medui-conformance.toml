repository = "https://github.com/Compliatory/MedUI"
version = "0.1.0-candidate"
# The single source of truth for the pin: CI derives its `actions/checkout` ref from this line,
# and `crates/trustsc-ui-dsl-authoring/tests/shared_conformance.rs` reads the same file, so the
# workflow and the harness cannot drift apart.
commit = "f22f6046be46451ea3b7f56a3f36a220279037d8"
# The implementation already has richer local behavior, but only syntax is claimed until each
# shared phase has a complete adapter that checks its normalized observations.
capabilities = ["syntax"]
# Diagnostic position precision, per `spec/diagnostics.md`. `parse_screen` is line-oriented and
# trims each line before matching, so no column survives to `Diagnostic::column`. The contract
# checks this declaration in both directions: pinned lines are matched exactly, pinned columns are
# required to be absent, and a diagnostic that started carrying one would fail the suite until
# this is raised to `full`.
positions = "line-only"
